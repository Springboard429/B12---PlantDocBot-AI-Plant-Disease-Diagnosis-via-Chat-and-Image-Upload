[project]
name = "plantdoc"
version = "0.1.0"
description = "Plant disease detection project with EDA, preprocessing, and augmentation"
authors = [
    {name = "Your Name", email = "your.email@example.com"},
]
dependencies = [
    "opencv-python>=4.8.0",
    "numpy>=1.24.0",
    "matplotlib>=3.7.0",
    "albumentations>=1.3.0",
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "scikit-learn>=1.3.0",
    "jupyter>=1.0.0",
    "pandas>=2.0.3",
]
requires-python = ">=3.8"
readme = "README.md"

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"
